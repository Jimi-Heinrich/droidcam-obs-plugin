name: macOS build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    env:
      WF_VERSION: "v5"
      OBS_VERSION: "32.1.2"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Welche Fassung laeuft
        run: echo "=== Workflow-Version $WF_VERSION ==="

      - name: Plugin-Quellen holen
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Workflow-Datei anzeigen
        run: head -20 plugin/.github/workflows/macos-build.yml

      - name: OBS-Quellen holen
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          path: deps/src
          submodules: recursive

      - name: Qt6, jpeg-turbo, ffmpeg
        run: brew install qt@6 jpeg-turbo ffmpeg

      - name: Frameworks aus dem OBS-Release ziehen
        run: |
          gh release download "$OBS_VERSION" \
            --repo obsproject/obs-studio \
            --pattern '*Intel*.dmg' --dir dmg
          hdiutil attach dmg/*.dmg -mountpoint /Volumes/OBS -nobrowse -quiet
          mkdir -p deps/lib
          cp -R /Volumes/OBS/OBS.app/Contents/Frameworks/libobs.framework deps/lib/
          cp -R /Volumes/OBS/OBS.app/Contents/Frameworks/libobs-frontend-api* deps/lib/ 2>/dev/null || true
          ls -la deps/lib
          echo "--- libobs.framework ---"
          ls -R deps/lib/libobs.framework | head -40
          hdiutil detach /Volumes/OBS -quiet
          ls deps/lib

      - name: Umgebung pruefen
        run: |
          QT=$(brew --prefix qt@6)
          echo "QT=$QT"
          ls "$QT/lib" | head -20
          echo "--- simde ---"
          find "$GITHUB_WORKSPACE/deps/src" -path '*simde/x86/sse2.h' | head -3

      - name: simde holen
        uses: actions/checkout@v4
        with:
          repository: simd-everywhere/simde
          path: deps/simde

      - name: obsconfig.h beschaffen
        run: |
          mkdir -p $GITHUB_WORKSPACE/deps/gen
          echo "--- Suche im Framework ---"
          find $GITHUB_WORKSPACE/deps/lib -name 'obsconfig.h' || true
          echo "--- Vorlage im Quellbaum ---"
          find $GITHUB_WORKSPACE/deps/src -name 'obsconfig.h.in' || true
          IN=$(find $GITHUB_WORKSPACE/deps/src -name 'obsconfig.h.in' | head -1)
          if [ -n "$IN" ]; then
            echo "--- Inhalt der Vorlage ---"
            cat "$IN"
            sed -e 's/#cmakedefine01 \(.*\)/#define \1 0/' \
                -e 's/#cmakedefine \(.*\)/\/* \1 *\//' \
                -e 's/@OBS_VERSION@/'"$OBS_VERSION"'/g' \
                -e 's/@[A-Za-z0-9_]*@//g' \
                "$IN" > $GITHUB_WORKSPACE/deps/gen/obsconfig.h
            echo "--- erzeugt ---"
            cat $GITHUB_WORKSPACE/deps/gen/obsconfig.h
          fi
          
      - name: Bauen
        working-directory: plugin
        run: |
          mkdir -p build
          QT=$(brew --prefix qt@6)

          SIMDE_ROOT="$GITHUB_WORKSPACE/deps/simde"
           EXTRA="-I$SIMDE_ROOT -I$GITHUB_WORKSPACE/deps/gen -F$QT/lib"

          EXTRA="-I$SIMDE_ROOT -F$QT/lib"
          for f in QtCore QtGui QtWidgets QtSvg QtXml; do
            EXTRA="$EXTRA -I$QT/lib/$f.framework/Headers"
          done
          echo "EXTRA=$EXTRA"

          make \
            ARCH=x86_64 \
            DEPS_DIR=$GITHUB_WORKSPACE/deps \
            OBS_DIR=$GITHUB_WORKSPACE/deps/src \
            FFMPEG_DIR=$(brew --prefix ffmpeg) \
            QT_DIR=$QT \
            JPEG_DIR=$(brew --prefix jpeg-turbo) \
            STATIC="$EXTRA"

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: droidcam-obs-macos-x86_64
          path: plugin/build/droidcam-obs.so
